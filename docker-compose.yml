services:
  db:
    image: postgres:16-alpine
    container_name: startgauge-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-startgauge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-startgauge_password}
      POSTGRES_DB: ${POSTGRES_DB:-startgauge}
    ports:
      - "5432:5432"
    volumes:
      - startgauge_postgres:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: startgauge-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: ./backend
    container_name: startgauge-api
    restart: always
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: sh -c "alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    container_name: startgauge-worker
    restart: always
    env_file: ./backend/.env
    depends_on:
      - db
      - redis
    command: celery -A app.core.celery worker --loglevel=info

  frontend:
    build: ./frontend
    container_name: startgauge-frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  startgauge_postgres:
